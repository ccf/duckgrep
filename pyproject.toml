[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[project]
name = "duckgrep"
version = "0.1.0"
description = "A DuckDB index of your codebase for coding agents: symbols, references, imports, call edges, text and git history, queryable with SQL."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=14",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "mcp>=1.2,<2",  # mcp 2 renamed FastMCP to MCPServer; migrate on purpose
]

[project.scripts]
duckgrep = "duckgrep.cli:main"
duckgrep-mcp = "duckgrep.mcp_server:main"

[dependency-groups]
bench = [
    "jedi>=0.20.0",
]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120
extend-exclude = ["tests/fixture"]  # test data: tests assert exact lines in it

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # the formatter owns line length; long SQL strings stay as written

[tool.pytest.ini_options]
testpaths = ["tests"]
