[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duckgrep"
version = "0.1.0"
description = "A DuckDB index of your codebase for coding agents: symbols, references, imports, call edges, text and git history, queryable with SQL."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=14",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "mcp>=1.2,<2",  # mcp 2 renamed FastMCP to MCPServer; migrate on purpose
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
duckgrep = "duckgrep.cli:main"
duckgrep-mcp = "duckgrep.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/duckgrep"]
