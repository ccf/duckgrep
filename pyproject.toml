[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[project]
name = "duckgrep"
version = "0.3.0"
description = "A DuckDB index of your codebase for coding agents: symbols, references, imports, call edges, text and git history, queryable with SQL."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=14",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "mcp>=1.2,<2",  # mcp 2 renamed FastMCP to MCPServer; migrate on purpose
]

keywords = ["code search", "coding agents", "mcp", "duckdb", "tree-sitter", "call graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://duckgrep.dev"
Repository = "https://github.com/ccf/duckgrep"
Results = "https://github.com/ccf/duckgrep/blob/main/bench/RESULTS.md"
Roadmap = "https://github.com/ccf/duckgrep/blob/main/docs/roadmap.md"
Changelog = "https://github.com/ccf/duckgrep/blob/main/CHANGELOG.md"

[project.scripts]
duckgrep = "duckgrep.cli:main"
duckgrep-mcp = "duckgrep.mcp_server:main"

[dependency-groups]
bench = [
    "jedi>=0.20.0",
]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
eval = [
    "jedi>=0.20.0",
    "numpy>=2.0",
    "protobuf>=7.35.1,<8",  # bench/eval/scip_pb2.py was generated for protobuf 7.35.1
    "psutil>=6.0",  # finds processes a run started outside its process group
    "scipy>=1.13",
    "unidiff>=1.0",
]

[tool.uv]
default-groups = ["dev", "eval"]  # the eval harness's tests run in the normal suite

[tool.ruff]
line-length = 120
extend-exclude = ["tests/fixture", "bench/eval/scip_pb2.py", "*.md"]  # test data; generated protobuf code; docs (the hooks format .py only)

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # the formatter owns line length; long SQL strings stay as written

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # tests import bench.eval
