# Publish to PyPI when a GitHub release is published. PyPI trusts this workflow
# (trusted publishing: project duckgrep, owner ccf, repo duckgrep, workflow
# release.yml, environment pypi), so there is no token to store.
# Run it by hand (workflow_dispatch) to build and smoke-test without publishing.
# Actions are pinned to commit SHAs; Dependabot proposes updates.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the main-branch check below needs history; no later fetch has credentials
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          enable-cache: false

      - name: The release is v<version>, from main
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version="$(uv version --short)"
          if [ "$TAG" != "v$version" ]; then
            echo "release tag $TAG does not match pyproject version $version (expected v$version)" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "release commit $GITHUB_SHA is not on main" >&2
            exit 1
          fi
          if ! grep -q "^## \[$version\] - " CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [$version] - YYYY-MM-DD' entry" >&2
            exit 1
          fi
          # a GitHub prerelease must carry a PEP 440 prerelease version, or PyPI would get a final release
          if [ "$PRERELEASE" = "true" ] && ! printf '%s' "$version" | grep -Eq '(a|b|rc|\.dev)[0-9]+$'; then
            echo "prerelease $TAG has the final version $version; use e.g. ${version}rc1" >&2
            exit 1
          fi

      - name: Tests
        run: uv run --frozen pytest -q

      - name: Build
        run: uv build

      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke" dist/*.whl
          bin="$RUNNER_TEMP/smoke/bin"
          "$bin/duckgrep" schema > /dev/null
          repo="$RUNNER_TEMP/repo"
          cp -R tests/fixture "$repo"
          git -C "$repo" init -q
          git -C "$repo" add -A
          git -C "$repo" -c user.name=ci -c user.email=ci@example.invalid commit -qm fixture
          "$bin/duckgrep" -C "$repo" index
          n="$("$bin/duckgrep" -C "$repo" q "SELECT count(*) FROM symbols" | tail -1)"
          echo "symbols: $n"
          [ "$n" -gt 0 ]
          # the MCP server is how agents use it: start it over stdio, list its tool, and check that a
          # call-graph query answers with the fixture's one caller of slugify (the script's second query
          # is a deliberate error, to show how errors come back)
          PATH="$bin:$PATH" "$bin/python" bench/mcp_smoke.py "$repo" | tee "$RUNNER_TEMP/mcp.txt"
          grep -q '^query |' "$RUNNER_TEMP/mcp.txt"
          grep -qF "$(printf 'pkg/core.py\t21\tEngine.__init__\tcall\t\timport\tslugify')" "$RUNNER_TEMP/mcp.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/duckgrep/
    permissions:
      id-token: write # trusted publishing; nothing else
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
